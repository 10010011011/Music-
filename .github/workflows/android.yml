name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36 platform and Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Install & build web app
        run: |
          npm install
          npm run build
      - name: TypeScript type check
        run: npm run lint
      - name: Create Android project (first run)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Install Sonora persistent folder storage
        run: bash scripts/install-sonora-storage-plugin.sh
      - name: Add audio & media permissions (no auto RECORD_AUDIO)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for P in READ_MEDIA_AUDIO READ_EXTERNAL_STORAGE MODIFY_AUDIO_SETTINGS WAKE_LOCK BLUETOOTH_CONNECT; do
            grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M
          done
          cat $M
      - name: Sync web assets
        run: npx cap sync android
      - name: Install Sonora launcher icon
        run: bash scripts/set-android-icon.sh
      - name: Gradle build (debug APK)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/Sonora-${{ github.ref_name }}-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sonora-debug-apk
          path: out/*.apk
      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
